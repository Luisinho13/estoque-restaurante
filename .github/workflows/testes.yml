# Roda o pytest a cada push e pull request. Não usa nenhum secret: os
# testes rodam num SQLite temporário, com MODO_DEMO ligado pelo conftest.
name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
